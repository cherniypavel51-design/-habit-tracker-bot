<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Привычки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#eef1fb;
    --bg-2:#f7f4fb;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.78);
    --glass-border:rgba(255,255,255,0.9);
    --ink:#1c1d2b;
    --ink-soft:#6b6d85;
    --ink-faint:#a3a5bd;
    --accent:#6d6bff;
    --accent-2:#8f7bff;
    --mint:#22c58b;
    --coral:#ff5d6c;
    --amber:#ffb020;
    --shadow-soft: 0 8px 30px rgba(90,90,150,0.10);
    --shadow-lift: 0 16px 40px rgba(90,90,150,0.18);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; width:100%; overflow-x:hidden;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% -10%, rgba(140,130,255,0.35), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(255,190,150,0.22), transparent 40%),
      radial-gradient(circle at 20% 100%, rgba(120,220,190,0.25), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh;
    overscroll-behavior:none;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; width:100%; margin:0 auto; padding:20px 16px 110px; position:relative; overflow-x:hidden;}

  /* ---------- Header ---------- */
  .header{display:flex; align-items:flex-end; justify-content:space-between; padding:6px 4px 18px;}
  .header .date{font-size:13px; color:var(--ink-soft); font-weight:600; text-transform:capitalize; letter-spacing:.2px;}
  .header h1{font-family:'Manrope',sans-serif; font-size:30px; font-weight:800; margin:2px 0 0; letter-spacing:-0.5px;}
  .streakpill{
    display:flex; align-items:center; gap:6px;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    padding:9px 14px 9px 10px;
    border-radius:999px;
    box-shadow:var(--shadow-soft);
    font-weight:800; font-size:15px;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .streakpill.bump{transform:scale(1.12);}
  .streakpill .flame{font-size:16px;}

  /* ---------- Glass card base ---------- */
  .glass{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:var(--shadow-soft);
  }

  /* ---------- Tabs ---------- */
  .tabs{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:4px; padding:6px;
    border-radius:24px; z-index:50;
    max-width:440px; width:calc(100% - 32px);
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    box-shadow:var(--shadow-lift);
  }
  .tab{
    flex:1; text-align:center; padding:11px 0; border-radius:18px;
    font-size:13px; font-weight:700; color:var(--ink-soft);
    cursor:pointer; transition:all .35s cubic-bezier(.22,1,.36,1);
    position:relative;
  }
  .tab.active{color:#fff;}
  .tab .tab-bg{
    position:absolute; inset:0; border-radius:18px; z-index:-1;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    opacity:0; transform:scale(.8);
    transition:all .4s cubic-bezier(.34,1.56,.64,1);
  }
  .tab.active .tab-bg{opacity:1; transform:scale(1); box-shadow:0 8px 20px rgba(109,107,255,0.4);}

  .view{display:none; animation:fadeSlide .35s cubic-bezier(.22,1,.36,1);}
  .view.active{display:block;}
  @keyframes fadeSlide{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Section titles ---------- */
  .section-title{font-size:13px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:1px; margin:22px 4px 10px;}
  .section-title:first-child{margin-top:0;}

  /* ---------- Habit card ---------- */
  .habit-wrap{position:relative; margin-bottom:12px; border-radius:var(--radius-lg); overflow:hidden;}
  .swipe-actions{
    position:absolute; top:0; right:0; height:100%; display:flex; align-items:stretch;
  }
  .swipe-btn{
    width:64px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:20px; cursor:pointer;
  }
  .swipe-btn.del{background:linear-gradient(135deg,#ff5d6c,#ff8390);}
  .habit-card{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:13px;
    padding:14px 16px;
    border-radius:var(--radius-lg);
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:var(--shadow-soft);
    transition:transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s;
    touch-action:pan-y;
  }
  .habit-card:active{transform:scale(0.98);}
  .habit-card.done{background:linear-gradient(135deg, rgba(109,107,255,0.16), rgba(143,123,255,0.10));}
  .habit-emoji{
    width:44px; height:44px; min-width:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:21px;
    background:rgba(255,255,255,0.65);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8);
  }
  .habit-info{flex:1; min-width:0;}
  .habit-name{font-weight:700; font-size:15px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .habit-meta{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .habit-meta .streakdot{color:var(--amber); font-weight:700;}

  /* checkbox */
  .check-btn{
    width:32px; height:32px; min-width:32px; border-radius:50%;
    border:2px solid rgba(109,107,255,0.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .3s cubic-bezier(.34,1.56,.64,1);
    background:rgba(255,255,255,0.5);
  }
  .check-btn.checked{
    background:linear-gradient(135deg, var(--mint), #17b57e);
    border-color:transparent;
    transform:scale(1.08);
    box-shadow:0 6px 16px rgba(34,197,139,0.4);
  }
  .check-btn svg{width:16px; height:16px; opacity:0; transform:scale(.5); transition:all .25s cubic-bezier(.34,1.56,.64,1);}
  .check-btn.checked svg{opacity:1; transform:scale(1);}

  /* quantity ring */
  .qty-ring-wrap{position:relative; width:44px; height:44px; min-width:44px; cursor:pointer;}
  .qty-ring-wrap svg{transform:rotate(-90deg);}
  .qty-ring-bg{fill:none; stroke:rgba(109,107,255,0.15); stroke-width:4;}
  .qty-ring-fg{fill:none; stroke:url(#ringGrad); stroke-width:4.5; stroke-linecap:round; transition:stroke-dashoffset .45s cubic-bezier(.22,1,.36,1);}
  .qty-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; color:var(--accent);}

  /* progress bar under quantity habits */
  .habit-progress-track{height:5px; border-radius:4px; background:rgba(109,107,255,0.12); margin-top:7px; overflow:hidden;}
  .habit-progress-fill{height:100%; border-radius:4px; background:linear-gradient(90deg, var(--accent), var(--mint)); transition:width .45s cubic-bezier(.22,1,.36,1);}

  /* ---------- Today widget stats ---------- */
  .stats-row{display:flex; gap:10px; margin-bottom:6px;}
  .stat-card{flex:1; padding:16px 14px; border-radius:var(--radius-md); text-align:left;}
  .stat-card .num{font-family:'Manrope',sans-serif; font-size:24px; font-weight:800;}
  .stat-card .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}

  /* ---------- Add button ---------- */
  .fab{
    position:fixed; right:20px; bottom:92px; z-index:60;
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 12px 28px rgba(109,107,255,0.45);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:26px; cursor:pointer;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    border:none;
  }
  .fab:active{transform:scale(0.88) rotate(90deg);}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:60px 20px 30px; color:var(--ink-soft);
  }
  .empty .emoji{font-size:46px; margin-bottom:14px; display:block;}
  .empty h3{font-family:'Manrope',sans-serif; font-size:19px; color:var(--ink); margin:0 0 6px;}
  .empty p{font-size:13.5px; line-height:1.5; max-width:280px; margin:0 auto;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,25,60,0.28);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    z-index:100; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:480px; margin:0 auto;
    background:rgba(250,249,255,0.92);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border-radius:28px 28px 0 0;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 60px rgba(90,80,160,0.25);
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.22,1,.36,1);
    max-height:88vh; overflow-y:auto;
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:38px; height:4px; background:rgba(109,107,255,0.25); border-radius:4px; margin:6px auto 16px;}
  .sheet h2{font-family:'Manrope',sans-serif; font-size:21px; margin:0 0 18px;}

  .field{margin-bottom:16px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:7px; text-transform:uppercase; letter-spacing:.5px;}
  .field input[type=text], .field input[type=number], .field input[type=time]{
    width:100%; padding:13px 14px; border-radius:14px; border:1px solid rgba(109,107,255,0.18);
    background:rgba(255,255,255,0.7); font-size:15px; font-family:inherit; color:var(--ink);
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(109,107,255,0.12);}
  .emoji-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .emoji-opt{
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; background:rgba(255,255,255,0.6); border:2px solid transparent; cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);
  }
  .emoji-opt.sel{border-color:var(--accent); background:rgba(109,107,255,0.15); transform:scale(1.1);}
  .seg{display:flex; gap:6px; background:rgba(109,107,255,0.08); padding:4px; border-radius:14px;}
  .seg-opt{flex:1; text-align:center; padding:10px 4px; border-radius:11px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:all .25s;}
  .seg-opt.sel{background:#fff; color:var(--accent); box-shadow:0 4px 10px rgba(109,107,255,0.18);}
  .days-grid{display:flex; gap:6px;}
  .day-opt{
    flex:1; text-align:center; padding:10px 0; border-radius:11px; font-size:12px; font-weight:700;
    background:rgba(109,107,255,0.08); color:var(--ink-soft); cursor:pointer; transition:all .2s;
  }
  .day-opt.sel{background:var(--accent); color:#fff;}
  .btn-primary{
    width:100%; padding:15px; border:none; border-radius:16px; font-size:15px; font-weight:800;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; cursor:pointer;
    box-shadow:0 10px 24px rgba(109,107,255,0.35); margin-top:6px;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-primary:active{transform:scale(0.97);}
  .btn-ghost{
    width:100%; padding:14px; border:none; border-radius:16px; font-size:14px; font-weight:700;
    background:rgba(255,93,108,0.12); color:var(--coral); cursor:pointer; margin-top:10px;
  }

  /* ---------- Calendar ---------- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-header h3{font-family:'Manrope',sans-serif; font-size:18px; margin:0; text-transform:capitalize;}
  .cal-nav{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--glass-strong); border:1px solid var(--glass-border); cursor:pointer; font-size:14px; font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; padding:0; width:100%;}
  .cal-dow{text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-faint); padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--ink-soft); position:relative; cursor:pointer;
    background:rgba(109,107,255,0.05); transition:transform .15s;
  }
  .cal-cell:active{transform:scale(0.9);}
  .cal-cell.empty{background:transparent; cursor:default;}
  .cal-cell.today{box-shadow:0 0 0 2px var(--accent) inset;}
  .cal-cell.l1{background:rgba(109,107,255,0.18); color:var(--ink);}
  .cal-cell.l2{background:rgba(109,107,255,0.38); color:#fff;}
  .cal-cell.l3{background:rgba(109,107,255,0.62); color:#fff;}
  .cal-cell.l4{background:linear-gradient(135deg,var(--accent),var(--mint)); color:#fff;}

  /* habit filter chips (calendar view) */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    padding:9px 15px; border-radius:999px; font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer;
    background:var(--glass-strong); border:1px solid var(--glass-border); color:var(--ink-soft); transition:all .25s;
  }
  .chip.sel{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(109,107,255,0.3);}

  /* stats view */
  .habit-stat-card{padding:16px; border-radius:var(--radius-lg); margin-bottom:12px;}
  .habit-stat-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .habit-stat-top .habit-name{font-size:14.5px;}
  .mini-stats{display:flex; gap:14px;}
  .mini-stat .n{font-weight:800; font-size:17px; font-family:'Manrope',sans-serif;}
  .mini-stat .l{font-size:10.5px; color:var(--ink-soft); font-weight:600;}

  .search-bar{
    display:flex; align-items:center; gap:8px; padding:12px 15px; border-radius:16px; margin-bottom:16px;
  }
  .search-bar input{flex:1; border:none; background:transparent; outline:none; font-size:14px; font-family:inherit; color:var(--ink);}

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-60px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:14px; font-size:13px; font-weight:600;
    z-index:200; transition:transform .35s cubic-bezier(.34,1.56,.64,1); box-shadow:0 10px 24px rgba(0,0,0,0.2);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div>
      <div class="date" id="todayDate">—</div>
      <h1>Привычки</h1>
    </div>
    <div class="streakpill" id="streakPill"><span class="flame">🔥</span><span id="streakNum">0</span></div>
  </div>

  <!-- TODAY -->
  <div class="view active" id="view-today">
    <div class="stats-row">
      <div class="stat-card glass" style="border-radius:22px;">
        <div class="num" id="statDoneToday">0/0</div>
        <div class="lbl">Сегодня</div>
      </div>
      <div class="stat-card glass" style="border-radius:22px;">
        <div class="num" id="statWeekPct">0%</div>
        <div class="lbl">За неделю</div>
      </div>
    </div>
    <div class="section-title">Сегодня</div>
    <div id="todayList"></div>
  </div>

  <!-- CALENDAR -->
  <div class="view" id="view-calendar">
    <div class="chip-row" id="calChips"></div>
    <div class="glass" style="border-radius:24px; padding:16px; overflow:hidden; width:100%;">
      <div class="cal-header">
        <div class="cal-nav" onclick="shiftMonth(-1)">‹</div>
        <h3 id="calMonthLabel">—</h3>
        <div class="cal-nav" onclick="shiftMonth(1)">›</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="view" id="view-stats">
    <div class="stats-row">
      <div class="stat-card glass" style="border-radius:22px;">
        <div class="num" id="statMonthPct">0%</div>
        <div class="lbl">За месяц</div>
      </div>
      <div class="stat-card glass" style="border-radius:22px;">
        <div class="num" id="statBestStreak">0</div>
        <div class="lbl">Лучший streak</div>
      </div>
    </div>
    <div class="search-bar glass" style="border-radius:16px;">
      <span style="opacity:.5;">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск привычки...">
    </div>
    <div class="section-title">По привычкам</div>
    <div id="statsList"></div>
  </div>

</div>

<div class="tabs">
  <div class="tab active" data-view="today"><div class="tab-bg"></div>Сегодня</div>
  <div class="tab" data-view="calendar"><div class="tab-bg"></div>Календарь</div>
  <div class="tab" data-view="stats"><div class="tab-bg"></div>Статистика</div>
</div>

<button class="fab" onclick="openHabitSheet()">+</button>

<!-- Add/Edit Habit Sheet -->
<div class="overlay" id="habitOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">Новая привычка</h2>

    <div class="field">
      <label>Название</label>
      <input type="text" id="fName" placeholder="Например, Читать 10 минут" maxlength="40">
    </div>

    <div class="field">
      <label>Иконка</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="field">
      <label>Категория</label>
      <div class="seg" id="categorySeg"></div>
    </div>

    <div class="field">
      <label>Тип</label>
      <div class="seg" id="typeSeg">
        <div class="seg-opt sel" data-type="check">Отметка</div>
        <div class="seg-opt" data-type="count">Количество</div>
      </div>
    </div>

    <div class="field" id="targetField" style="display:none;">
      <label>Цель за день</label>
      <input type="number" id="fTarget" placeholder="7" min="1" max="99">
    </div>

    <div class="field">
      <label>Дни</label>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="field">
      <label>Напоминание (для Telegram-бота)</label>
      <input type="time" id="fReminder" value="09:00">
    </div>

    <button class="btn-primary" onclick="saveHabit()">Сохранить</button>
    <button class="btn-ghost" id="archiveBtn" style="display:none;" onclick="toggleArchive()">Архивировать</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute;">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d6bff"/>
      <stop offset="100%" stop-color="#22c58b"/>
    </linearGradient>
  </defs>
</svg>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ===================== TELEGRAM ===================== */
const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }
// В проде user_id берём из initDataUnsafe. Для теста в обычном браузере — фиксированный id.
const USER_ID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
  ? String(tg.initDataUnsafe.user.id)
  : 'test-user';

/* ===================== STORAGE (backend API) ===================== */
let state = { habits: [], completions: {} }; // completions[habitId][dateStr] = true/false or number
let dataLoaded = false;

async function loadState(){
  try{
    const res = await fetch(`/api/state?user_id=${encodeURIComponent(USER_ID)}`);
    if(res.ok){ state = await res.json(); }
  }catch(e){ console.error('load failed', e); }
  dataLoaded = true;
  renderAll();
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await fetch('/api/state', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: USER_ID, state })
      });
    }catch(e){ console.error('save failed', e); }
  }, 250);
}

/* ===================== HELPERS ===================== */
function todayStr(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtHeaderDate(){
  const d = new Date();
  const opts = {weekday:'long', day:'numeric', month:'long'};
  return d.toLocaleDateString('ru-RU', opts);
}
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function dowIndex(d){ let i = d.getDay()-1; if(i<0) i=6; return i; }
function isScheduledOn(habit, dateObj){
  if(habit.schedule.type==='daily') return true;
  if(habit.schedule.type==='days') return habit.schedule.days.includes(dowIndex(dateObj));
  return true;
}
function getVal(habitId, dateStr){
  const h = state.completions[habitId];
  if(!h) return habit.type==='count'?0:false;
  return h[dateStr] ?? (0);
}
function completionValue(habit, dateStr){
  const rec = state.completions[habit.id];
  if(!rec || rec[dateStr]===undefined) return habit.type==='count' ? 0 : false;
  return rec[dateStr];
}
function isDoneOn(habit, dateStr){
  const v = completionValue(habit, dateStr);
  if(habit.type==='count') return v >= (habit.target||1);
  return !!v;
}
function setVal(habitId, dateStr, val){
  if(!state.completions[habitId]) state.completions[habitId] = {};
  state.completions[habitId][dateStr] = val;
  saveState();
}

function calcStreak(habit){
  let streak=0;
  let d = new Date();
  // if today not yet done (and scheduled), start checking from yesterday for "current streak" logic but count today if done
  for(let i=0;i<400;i++){
    const ds = todayStr(d);
    if(isScheduledOn(habit,d)){
      if(isDoneOn(habit,ds)){ streak++; }
      else {
        if(ds===todayStr()) { /* today not done yet, doesn't break streak */ }
        else break;
      }
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function calcBestStreak(habit){
  // simple approx: scan completions history
  const dates = Object.keys(state.completions[habit.id]||{}).sort();
  if(!dates.length) return 0;
  let best=0, cur=0, prevDate=null;
  let d = new Date(dates[0]);
  let end = new Date();
  while(d<=end){
    const ds = todayStr(d);
    if(isScheduledOn(habit,d)){
      if(isDoneOn(habit,ds)){ cur++; best=Math.max(best,cur);}
      else cur=0;
    }
    d.setDate(d.getDate()+1);
  }
  return best;
}

function overallStreak(){
  // days in a row where ALL scheduled non-paused non-archived habits fully done
  const active = state.habits.filter(h=>!h.paused && !h.archived);
  if(!active.length) return 0;
  let streak=0; let d=new Date();
  for(let i=0;i<365;i++){
    const ds = todayStr(d);
    const scheduled = active.filter(h=>isScheduledOn(h,d));
    if(scheduled.length===0){ d.setDate(d.getDate()-1); continue; }
    const allDone = scheduled.every(h=>isDoneOn(h,ds));
    if(allDone) streak++;
    else if(ds!==todayStr()) break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* ===================== RENDER: TODAY ===================== */
function renderToday(){
  document.getElementById('todayDate').textContent = fmtHeaderDate();
  const list = document.getElementById('todayList');
  const now = new Date();
  const ds = todayStr();
  const active = state.habits.filter(h=>!h.archived && !h.paused && isScheduledOn(h, now));

  let doneCount=0;
  active.forEach(h=>{ if(isDoneOn(h,ds)) doneCount++; });
  document.getElementById('statDoneToday').textContent = doneCount+'/'+active.length;

  if(!state.habits.length){
    list.innerHTML = `<div class="empty">
      <span class="emoji">🌱</span>
      <h3>Пока пусто</h3>
      <p>Нажми на кнопку «+» внизу и добавь первую привычку. Начни с чего-то простого.</p>
    </div>`;
  } else if(!active.length){
    list.innerHTML = `<div class="empty">
      <span class="emoji">✨</span>
      <h3>На сегодня ничего не запланировано</h3>
      <p>Загляни в календарь или добавь новую привычку.</p>
    </div>`;
  } else {
    list.innerHTML = active.map(h=>habitCardHTML(h, ds)).join('');
  }
  attachSwipeHandlers();
  updateStreakPill();
  renderWeekStat();
}

function habitCardHTML(h, ds){
  const done = isDoneOn(h, ds);
  const streak = calcStreak(h);
  let control;
  if(h.type==='count'){
    const val = completionValue(h, ds);
    const target = h.target||1;
    const pct = Math.min(100, Math.round((val/target)*100));
    const r=17, circ=2*Math.PI*r, offset = circ - (pct/100)*circ;
    control = `<div class="qty-ring-wrap" onclick="incrementHabit('${h.id}')">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle class="qty-ring-bg" cx="22" cy="22" r="${r}"></circle>
        <circle class="qty-ring-fg" cx="22" cy="22" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="qty-label">${val}/${target}</div>
    </div>`;
  } else {
    control = `<div class="check-btn ${done?'checked':''}" onclick="toggleCheck('${h.id}')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  }
  let progressBar = '';
  if(h.type==='count'){
    const val = completionValue(h, ds); const target=h.target||1;
    progressBar = `<div class="habit-progress-track"><div class="habit-progress-fill" style="width:${Math.min(100,(val/target)*100)}%;"></div></div>`;
  }
  return `<div class="habit-wrap" data-id="${h.id}">
    <div class="swipe-actions">
      <div class="swipe-btn del" onclick="deleteHabit('${h.id}')">🗑</div>
    </div>
    <div class="habit-card ${done?'done':''}" data-id="${h.id}" onclick="editHabit('${h.id}', event)">
      <div class="habit-emoji">${h.emoji}</div>
      <div class="habit-info">
        <div class="habit-name">${escapeHtml(h.name)}</div>
        <div class="habit-meta">${streak>0?`<span class="streakdot">🔥 ${streak}</span>`:'<span>Начни серию</span>'}${h.category?`<span>· ${h.category}</span>`:''}</div>
        ${progressBar}
      </div>
      <div onclick="event.stopPropagation()">${control}</div>
    </div>
  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function toggleCheck(id){
  const ds = todayStr();
  const cur = completionValue(state.habits.find(h=>h.id===id), ds);
  setVal(id, ds, !cur);
  const cardEl = document.querySelector(`.habit-card[data-id="${id}"]`);
  if(cardEl){ cardEl.style.transform='scale(1.02)'; setTimeout(()=>cardEl.style.transform='',180); }
  renderAll();
}
function incrementHabit(id){
  const h = state.habits.find(x=>x.id===id);
  const ds = todayStr();
  let val = completionValue(h, ds);
  const target = h.target||1;
  val = val>=target ? 0 : val+1; // tap past target resets (simple cycle)
  setVal(id, ds, val);
  renderAll();
  if(val>=target) showToast('Готово! Цель достигнута 🎉');
}

/* ===================== SWIPE ===================== */
function attachSwipeHandlers(){
  document.querySelectorAll('.habit-card').forEach(card=>{
    let startX=0, curX=0, dragging=false;
    const wrap = card.parentElement;
    card.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; dragging=true; card.style.transition='none'; }, {passive:true});
    card.addEventListener('touchmove', e=>{
      if(!dragging) return;
      curX = e.touches[0].clientX - startX;
      if(curX>0) curX=0;
      if(curX<-70) curX=-70;
      card.style.transform = `translateX(${curX}px)`;
    }, {passive:true});
    card.addEventListener('touchend', ()=>{
      dragging=false;
      card.style.transition='transform .3s cubic-bezier(.22,1,.36,1)';
      if(curX < -35){ card.style.transform='translateX(-70px)'; }
      else { card.style.transform='translateX(0)'; }
      curX=0;
    });
  });
}

/* ===================== STREAK PILL / WEEK STAT ===================== */
function updateStreakPill(){
  const s = overallStreak();
  const pill = document.getElementById('streakPill');
  const numEl = document.getElementById('streakNum');
  if(parseInt(numEl.textContent)!==s){
    numEl.textContent = s;
    pill.classList.add('bump');
    setTimeout(()=>pill.classList.remove('bump'), 300);
  }
}
function renderWeekStat(){
  const active = state.habits.filter(h=>!h.archived);
  let total=0, done=0;
  for(let i=0;i<7;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = todayStr(d);
    active.forEach(h=>{
      if(h.paused) return;
      if(new Date(h.createdAt) > d) return;
      if(isScheduledOn(h,d)){ total++; if(isDoneOn(h,ds)) done++; }
    });
  }
  const pct = total? Math.round(done/total*100) : 0;
  document.getElementById('statWeekPct').textContent = pct+'%';
}
function renderMonthStat(){
  const active = state.habits.filter(h=>!h.archived);
  let total=0, done=0;
  for(let i=0;i<30;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = todayStr(d);
    active.forEach(h=>{
      if(h.paused) return;
      if(new Date(h.createdAt) > d) return;
      if(isScheduledOn(h,d)){ total++; if(isDoneOn(h,ds)) done++; }
    });
  }
  const pct = total? Math.round(done/total*100) : 0;
  document.getElementById('statMonthPct').textContent = pct+'%';
  let best=0;
  active.forEach(h=>{ best = Math.max(best, calcBestStreak(h)); });
  document.getElementById('statBestStreak').textContent = best;
}

/* ===================== CALENDAR ===================== */
let calMonth = new Date();
let calFilterId = 'all';
function renderCalChips(){
  const wrap = document.getElementById('calChips');
  const chips = [{id:'all', name:'Все', emoji:'📅'}, ...state.habits.filter(h=>!h.archived)];
  wrap.innerHTML = chips.map(h=>`<div class="chip ${calFilterId===h.id?'sel':''}" onclick="setCalFilter('${h.id}')">${h.emoji||''} ${escapeHtml(h.name||h.id==='all'?h.name:'')}</div>`).join('');
}
function setCalFilter(id){ calFilterId=id; renderCalendar(); renderCalChips(); }
function shiftMonth(delta){ calMonth.setMonth(calMonth.getMonth()+delta); renderCalendar(); }
function renderCalendar(){
  renderCalChips();
  const label = calMonth.toLocaleDateString('ru-RU', {month:'long', year:'numeric'});
  document.getElementById('calMonthLabel').textContent = label;
  const grid = document.getElementById('calGrid');
  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = dowIndex(firstDay);
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;

  const habitsForCalc = calFilterId==='all' ? state.habits.filter(h=>!h.archived) : state.habits.filter(h=>h.id===calFilterId);

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const ds = todayStr(d);
    const isToday = ds===todayStr();
    const scheduled = habitsForCalc.filter(h=> new Date(h.createdAt)<=d && isScheduledOn(h,d) && !h.paused);
    let level = 0;
    if(scheduled.length){
      const doneN = scheduled.filter(h=>isDoneOn(h,ds)).length;
      const ratio = doneN/scheduled.length;
      if(ratio>0 && ratio<0.34) level=1;
      else if(ratio>=0.34 && ratio<0.67) level=2;
      else if(ratio>=0.67 && ratio<1) level=3;
      else if(ratio===1) level=4;
    }
    html += `<div class="cal-cell ${isToday?'today':''} ${level?'l'+level:''}">${day}</div>`;
  }
  grid.innerHTML = html;
}

/* ===================== STATS VIEW ===================== */
function renderStatsList(filterText=''){
  renderMonthStat();
  const list = document.getElementById('statsList');
  const items = state.habits.filter(h=>!h.archived && h.name.toLowerCase().includes(filterText.toLowerCase()));
  if(!items.length){
    list.innerHTML = `<div class="empty"><span class="emoji">📊</span><h3>Нет данных</h3><p>Добавь привычки, чтобы видеть статистику.</p></div>`;
    return;
  }
  list.innerHTML = items.map(h=>{
    const streak = calcStreak(h);
    const best = calcBestStreak(h);
    let total=0, done=0;
    for(let i=0;i<30;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      if(new Date(h.createdAt)>d) continue;
      if(isScheduledOn(h,d)){ total++; if(isDoneOn(h,todayStr(d))) done++; }
    }
    const pct = total? Math.round(done/total*100):0;
    return `<div class="habit-stat-card glass">
      <div class="habit-stat-top">
        <div class="habit-emoji">${h.emoji}</div>
        <div class="habit-name">${escapeHtml(h.name)}${h.paused?' <span style="color:var(--ink-faint); font-size:11px;">· на паузе</span>':''}</div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="n">🔥 ${streak}</div><div class="l">Сейчас</div></div>
        <div class="mini-stat"><div class="n">${best}</div><div class="l">Рекорд</div></div>
        <div class="mini-stat"><div class="n">${pct}%</div><div class="l">За месяц</div></div>
      </div>
    </div>`;
  }).join('');
}

/* ===================== TABS ===================== */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

/* ===================== ADD/EDIT SHEET ===================== */
const EMOJIS = ['💧','📚','🏃','🧘','🥗','😴','✍️','💊','🎯','🎸','🧹','☕','🌱','💪','🧠','📵'];
const CATEGORIES = ['Здоровье','Продуктивность','Учёба','Разное'];
let editingId = null;
let sel = { emoji:EMOJIS[0], category:CATEGORIES[0], type:'check', days:[0,1,2,3,4,5,6] };

function buildEmojiGrid(){
  document.getElementById('emojiGrid').innerHTML = EMOJIS.map(e=>
    `<div class="emoji-opt ${sel.emoji===e?'sel':''}" onclick="pickEmoji('${e}')">${e}</div>`).join('');
}
function pickEmoji(e){ sel.emoji=e; buildEmojiGrid(); }
function buildCategorySeg(){
  document.getElementById('categorySeg').innerHTML = CATEGORIES.map(c=>
    `<div class="seg-opt ${sel.category===c?'sel':''}" onclick="pickCategory('${c}')">${c}</div>`).join('');
}
function pickCategory(c){ sel.category=c; buildCategorySeg(); }
function buildDaysGrid(){
  document.getElementById('daysGrid').innerHTML = DOW.map((d,i)=>
    `<div class="day-opt ${sel.days.includes(i)?'sel':''}" onclick="toggleDay(${i})">${d}</div>`).join('');
}
function toggleDay(i){
  if(sel.days.includes(i)) sel.days = sel.days.filter(x=>x!==i);
  else sel.days.push(i);
  buildDaysGrid();
}
document.getElementById('typeSeg').addEventListener('click', e=>{
  const opt = e.target.closest('.seg-opt'); if(!opt) return;
  sel.type = opt.dataset.type;
  document.querySelectorAll('#typeSeg .seg-opt').forEach(o=>o.classList.toggle('sel', o===opt));
  document.getElementById('targetField').style.display = sel.type==='count' ? 'block' : 'none';
});

function openHabitSheet(){
  editingId = null;
  sel = { emoji:EMOJIS[0], category:CATEGORIES[0], type:'check', days:[0,1,2,3,4,5,6] };
  document.getElementById('sheetTitle').textContent = 'Новая привычка';
  document.getElementById('fName').value='';
  document.getElementById('fTarget').value=7;
  document.getElementById('fReminder').value='09:00';
  document.getElementById('targetField').style.display='none';
  document.getElementById('archiveBtn').style.display='none';
  document.querySelectorAll('#typeSeg .seg-opt').forEach(o=>o.classList.toggle('sel', o.dataset.type==='check'));
  buildEmojiGrid(); buildCategorySeg(); buildDaysGrid();
  document.getElementById('habitOverlay').classList.add('show');
}
function editHabit(id, evt){
  if(evt.target.closest('.check-btn') || evt.target.closest('.qty-ring-wrap')) return;
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  editingId = id;
  sel = { emoji:h.emoji, category:h.category, type:h.type, days: h.schedule.type==='days'?[...h.schedule.days]:[0,1,2,3,4,5,6] };
  document.getElementById('sheetTitle').textContent = 'Изменить привычку';
  document.getElementById('fName').value = h.name;
  document.getElementById('fTarget').value = h.target||7;
  document.getElementById('fReminder').value = h.reminderTime||'09:00';
  document.getElementById('targetField').style.display = h.type==='count'?'block':'none';
  document.querySelectorAll('#typeSeg .seg-opt').forEach(o=>o.classList.toggle('sel', o.dataset.type===h.type));
  document.getElementById('archiveBtn').style.display='block';
  document.getElementById('archiveBtn').textContent = h.paused ? 'Возобновить' : 'Приостановить';
  buildEmojiGrid(); buildCategorySeg(); buildDaysGrid();
  document.getElementById('habitOverlay').classList.add('show');
}
function closeSheet(){ document.getElementById('habitOverlay').classList.remove('show'); }
document.getElementById('habitOverlay').addEventListener('click', e=>{ if(e.target.id==='habitOverlay') closeSheet(); });

function saveHabit(){
  const name = document.getElementById('fName').value.trim();
  if(!name){ showToast('Введи название'); return; }
  const target = parseInt(document.getElementById('fTarget').value)||1;
  const reminderTime = document.getElementById('fReminder').value;
  const schedule = sel.days.length===7 ? {type:'daily'} : {type:'days', days:sel.days};

  if(editingId){
    const h = state.habits.find(x=>x.id===editingId);
    Object.assign(h, { name, emoji:sel.emoji, category:sel.category, type:sel.type, target, schedule, reminderTime });
  } else {
    state.habits.push({
      id: 'h'+Date.now(),
      name, emoji:sel.emoji, category:sel.category, type:sel.type, target,
      schedule, reminderTime, paused:false, archived:false, createdAt:new Date().toISOString()
    });
  }
  saveState();
  closeSheet();
  renderAll();
  showToast(editingId?'Сохранено':'Привычка добавлена');
}
function toggleArchive(){
  const h = state.habits.find(x=>x.id===editingId);
  if(!h) return;
  h.paused = !h.paused;
  saveState();
  closeSheet();
  renderAll();
  showToast(h.paused?'Приостановлено':'Возобновлено');
}
function deleteHabit(id){
  const wrap = document.querySelector(`.habit-wrap[data-id="${id}"]`);
  if(wrap){ wrap.style.transition='all .3s ease'; wrap.style.opacity='0'; wrap.style.maxHeight='0'; wrap.style.marginBottom='0'; }
  setTimeout(()=>{
    state.habits = state.habits.filter(h=>h.id!==id);
    delete state.completions[id];
    saveState();
    renderAll();
  }, 280);
}

/* ===================== TOAST ===================== */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== RENDER ALL ===================== */
function renderAll(){
  if(!dataLoaded) return;
  renderToday();
  const activeTab = document.querySelector('.tab.active').dataset.view;
  if(activeTab==='calendar') renderCalendar();
  if(activeTab==='stats') renderStatsList(document.getElementById('searchInput').value);
}

loadState();
</script>
